# CDC §4.7 : Kafka -> Spark (modèle Hugging Face) -> PostgreSQL -> API/Dashboard
# CDC §4.8 : tout conteneurisé, health checks, redémarrage automatique
#
# Démarrage complet :
#   cp .env.example .env && nano .env
#   mkdir -p data && cp /chemin/CanalPlus_Churn_1M_Final.csv data/
#   docker compose up -d kafka postgres
#   docker compose ps                            
#   bash 2_ingestion_kafka/create_topics.sh
#   docker compose up -d spark api
#   docker compose --profile producer up -d producer


services:

  # ----------------------- Ingestion temps réel ----------------------

  kafka:
    image: apache/kafka:3.7.0
    container_name: churn_kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [churn_net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  # -------------------------- Persistance ----------------------------
  postgres:
    image: postgres:16
    container_name: churn_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"     # Power BI Direct Query (restreindre par pare-feu sur VPS)
    environment:
      POSTGRES_DB: churn_db
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data     
      - ./4_stockage_postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churn_user} -d churn_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [churn_net]

  # -------------------- Producer (simulateur Kafka) -------------------
  producer:
    build: ./2_ingestion_kafka
    container_name: churn_producer
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./data:/data:ro
    command: ["--bootstrap", "kafka:9092", "--csv", "/data/CanalPlus_Churn_1M_Final.csv",
              "--mode", "${PRODUCER_MODE:-continuous}", "--rate", "${PRODUCER_RATE:-20}"]
    networks: [churn_net]
    profiles: ["producer"]     # lancement à la demande : docker compose --profile producer up -d producer

  # ------------------- Traitement & scoring (Spark) -------------------
  spark:
    build: ./3_traitement_spark
    container_name: churn_spark
    restart: unless-stopped
    depends_on:
      kafka:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPICS: abonnements,usages,paiements
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: churn_db
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HF_REPO_ID: ${HF_REPO_ID}
      HF_TOKEN: ${HF_TOKEN}
      SEUIL_CHURN: ${SEUIL_CHURN:-0.5}
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-10}
      MODEL_VERSION: ${MODEL_VERSION:-1}
    volumes:
      - model_cache:/app/model_cache
      - spark_checkpoints:/checkpoints
    networks: [churn_net]

  # ---------------- Services & dashboard (FastAPI) --------------------
  api:
    build: ./5_services_dashboard/api
    container_name: churn_api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: churn_db
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HF_REPO_ID: ${HF_REPO_ID}
      HF_TOKEN: ${HF_TOKEN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Definir JWT_SECRET_KEY dans .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      SEUIL_CHURN: ${SEUIL_CHURN:-0.5}
    volumes:
      - model_cache:/app/model_cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [churn_net]

volumes:
  kafka_data:
  postgres_data:
  model_cache:
  spark_checkpoints:

networks:
  churn_net:
    name: churn_net
    driver: bridge
